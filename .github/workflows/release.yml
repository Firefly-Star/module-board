name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack dist
        run: (cd dist && zip -r ../module-board.zip .)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: module-board.zip
          generate_release_notes: true
